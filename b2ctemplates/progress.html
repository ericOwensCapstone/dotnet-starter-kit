<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - OHD Harvest Marketplace</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-color: rgba(76,175,80,1);
            --background-color: #1b1f22;
            --surface-color: #202528;
            --text-primary: rgba(255,255,255, 0.70);
            --text-secondary: rgba(255,255,255, 0.50);
            --border-radius: 5px;
            --elevation-25: 0px 8px 10px -5px rgba(0,0,0,0.2), 0px 16px 24px 2px rgba(0,0,0,0.14), 0px 6px 30px 5px rgba(0,0,0,0.12);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', 'Helvetica', 'Arial', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 16px;
        }
        
        .paper {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--elevation-25);
            padding: 32px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.125rem;
            font-weight: 400;
            line-height: 1.235;
            letter-spacing: 0.00735em;
            margin-bottom: 48px;
        }
        
        /* Loading Animation */
        .loader {
            margin: 0 auto 32px;
            width: 60px;
            height: 60px;
        }
        
        .spinner {
            width: 100%;
            height: 100%;
            position: relative;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner-circle {
            stroke: var(--primary-color);
            stroke-dasharray: 150;
            stroke-dashoffset: 75;
            stroke-width: 2;
            fill: none;
            animation: dash 1.5s ease-in-out infinite;
        }
        
        @keyframes dash {
            0% {
                stroke-dashoffset: 150;
            }
            50% {
                stroke-dashoffset: 40;
            }
            100% {
                stroke-dashoffset: 150;
            }
        }
        
        /* Progress Text */
        .progress-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .progress-detail {
            font-size: 0.875rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        /* B2C Content */
        #api {
            background: transparent;
            margin-top: 24px;
        }
        
        #api .intro {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        #api .intro h2 {
            display: none;
        }
        
        /* Dots Animation */
        .loading-dots {
            display: inline-block;
            width: 60px;
            text-align: left;
        }
        
        .loading-dots::after {
            content: '.';
            animation: dots 1.5s steps(3, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }
        
        /* Alternative Progress Bar */
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 32px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            animation: progress 2s ease-in-out infinite;
        }
        
        @keyframes progress {
            0% {
                width: 0%;
                opacity: 0;
            }
            50% {
                width: 60%;
                opacity: 1;
            }
            100% {
                width: 100%;
                opacity: 0;
            }
        }
        
        /* AGGRESSIVE B2C OVERRIDES */
        
        /* Force dark theme on all B2C injected content */
        #api * {
            color: var(--text-primary) !important;
            font-family: 'Roboto', 'Helvetica', 'Arial', sans-serif !important;
        }
        
        /* Override any background colors B2C might inject */
        #api,
        #api .panel,
        #api .progress-container {
            background-color: transparent !important;
            background: transparent !important;
        }
        
        /* Progress text styling */
        #api p,
        #api span,
        #api div {
            color: var(--text-secondary) !important;
        }
        
        /* Remove default styling */
        #api .panel {
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }
        
        /* Headings */
        #api h1,
        #api h2,
        #api h3,
        #api h4 {
            color: var(--text-primary) !important;
            font-weight: 400 !important;
        }
        
        /* Links */
        #api a {
            color: var(--primary-color) !important;
            text-decoration: none !important;
        }
        
        #api a:hover {
            text-decoration: underline !important;
        }
        
        /* Remove dividers */
        #api .divider,
        #api hr {
            display: none !important;
        }
        
        /* Progress indicators from B2C */
        #api .working,
        #api .progress-text {
            color: var(--text-secondary) !important;
            text-align: center !important;
        }
        
        /* Spinner overrides if B2C adds its own */
        #api .spinner,
        #api .loader {
            border-color: var(--primary-color) !important;
        }
        
        /* Any status messages */
        #api .status,
        #api .info {
            color: var(--text-secondary) !important;
            background-color: transparent !important;
            border: none !important;
        }
        
        /* Loading dots animation for B2C content */
        #api .loading::after {
            content: '...' !important;
            animation: dots 1.5s steps(3, end) infinite !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paper">
            <h1>
                OHD Harvest<br />
                Marketplace
            </h1>
            
            <div class="loader">
                <svg class="spinner" viewBox="0 0 50 50">
                    <circle class="spinner-circle" cx="25" cy="25" r="20"></circle>
                </svg>
            </div>
            
            <p class="progress-text">
                Processing<span class="loading-dots"></span>
            </p>
            <p class="progress-detail">Please wait while we complete your request</p>
            
            <div id="api"></div>
            
            <div class="progress-bar">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-redirect fallback after 30 seconds
        setTimeout(function() {
            if (window.location.href.indexOf('error') === -1) {
                console.log('Progress timeout - redirecting to home');
                window.location.href = '/';
            }
        }, 30000);
    </script>
</body>
</html>
