<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSH.Starter.Blazor</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/fsh.css" rel="stylesheet" />
    <link href="css/loading.css" rel="stylesheet" />
    <link href="css/dark-panel.css" rel="stylesheet" />
    <link href="FSH.Starter.Blazor.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">

        <div class="ohd-panel-wrapper">
            <div class="ohd-panel-background"></div>
            <div class="ohd-panel-container">
                <div class="ohd-panel-content">
                    <h1 class="ohd-panel-title">
                        OHD Harvest<br />
                        Marketplace
                    </h1>
                    <div class="ohd-panel-message" id="loading-message">
                        Please wait while we load the latest!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // Check if returning from B2C login and update message
        if (window.location.pathname.includes('/authentication/login-callback')) {
            var messageElement = document.getElementById('loading-message');
            if (messageElement) {
                messageElement.textContent = 'Please wait while we access your account!';
            }
        }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
