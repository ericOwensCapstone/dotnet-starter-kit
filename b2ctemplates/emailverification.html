<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - OHD Harvest Marketplace</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link rel="preload" href="https://ohdb2ctemplates.blob.core.windows.net/ohdb2c-templates/cornfield.png" as="image">
    <style>
        :root {
            --primary-color: rgba(76,175,80,1);
            --primary-dark: rgba(56,142,60,1);
            --background-color: #1b1f22;
            --surface-color: #202528;
            --text-primary: rgba(255,255,255, 0.70);
            --text-secondary: rgba(255,255,255, 0.50);
            --border-radius: 5px;
            --elevation-25: 0px 8px 10px -5px rgba(0,0,0,0.2), 0px 16px 24px 2px rgba(0,0,0,0.14), 0px 6px 30px 5px rgba(0,0,0,0.12);
        }
        
        body {
            font-family: 'Roboto', 'Helvetica', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            background-image: url('https://ohdb2ctemplates.blob.core.windows.net/ohdb2c-templates/cornfield.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 16px;
        }
        
        .paper {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--elevation-25);
            padding: 32px;
        }
        
        h1 {
            font-size: 2.125rem;
            font-weight: 400;
            line-height: 1.235;
            letter-spacing: 0.00735em;
            margin-bottom: 32px;
            text-align: center;
            color: var(--text-primary);
        }
        
        /* Email verification specific styling */
        .intro h2 {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 16px;
            text-align: center;
        }
        
        .intro p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 24px;
        }
        
        /* Hide itemLevel errors by default */
        .attrEntry .itemLevel {
            display: none;
        }
        
        /* Basic input styling for dark theme */
        #api input[type="text"],
        #api input[type="email"],
        #api input[type="tel"] {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.23);
            border-radius: var(--border-radius);
            padding: 12px 16px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 4px;
        }
        
        #api input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        #api label {
            color: var(--text-primary);
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }
        
        /* Button styling */
        #api button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px 24px;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02857em;
            text-transform: uppercase;
            cursor: pointer;
            margin-right: 12px;
            margin-top: 10px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        
        #api button:hover {
            background-color: var(--primary-dark);
        }
        
        /* Verification code specific styling */
        #api .verificationInfoText {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 16px;
            text-align: center;
        }
        
        #api .verificationSuccessText {
            color: var(--primary-color);
            font-size: 0.875rem;
            margin-bottom: 16px;
            text-align: center;
        }
        
        #api .verificationErrorText {
            color: #ff6b6b;
            font-size: 0.875rem;
            margin-bottom: 16px;
            text-align: center;
        }
        
        /* Style error text */
        #api .error {
            color: #ff6b6b;
            font-size: 0.875rem;
            margin-top: 4px;
        }
        
        /* Add spacing between form fields */
        #api .entry-item {
            margin-bottom: 20px;
        }
        
        /* Loading/working state */
        #api .working {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 16px;
        }
        
        /* Success messages */
        #api .success {
            color: var(--primary-color);
            font-size: 0.875rem;
            margin-top: 16px;
            text-align: center;
        }
        
        /* Style links */
        #api a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        #api a:hover {
            text-decoration: underline;
        }
        


        /* Hide cancel button if specified in policy */
        #api button.cancel,
        #api button[aria-label="Cancel"] {
            display: none;
        }
        
        /* Center the verification controls */
        #api .buttons {
            text-align: center;
            margin-top: 20px;
        }
        
        /* Style the email display */
        #api .emailAddress {
            font-weight: 500;
            color: var(--text-primary);
        }



        
        #api .intro {
            display: none !important;
        }

        #email_intro {
            display: none !important;
        }

        #email_label {
            display: none !important;
        }

        .helpLink.tiny {
            display: none !important;
        }

        #api #attributeList ul {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            list-style: none !important;
            text-align: left !important;
        }

        #api #attributeList ul li {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            text-align: left !important;
        }

        /* Hide Continue button by default */
        #continue {
            display: none !important;
        }

        /* Show Continue button when email_success is visible */
        #email_success[aria-hidden="false"] ~ * #continue,
        #email_success[aria-hidden="false"] ~ #continue,
        #api #email_success[aria-hidden="false"] ~ * #continue {
            display: inline-block !important;
        }

        /* Alternative - check if we can target by document state */
        #api:has(#email_success[aria-hidden="false"]) #continue {
            display: inline-block !important;
        }

        /* More specific targeting */
        div[id="email_success"][aria-hidden="false"] ~ div #continue,
        div[id="email_success"][aria-hidden="false"] ~ * #continue {
            display: inline-block !important;
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="paper">
            <h1>
                OHD Harvest<br />
                Marketplace
            </h1>
            <div id="api"></div>
        </div>
    </div>
</body>
</html>
