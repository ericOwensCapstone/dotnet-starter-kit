<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSH.Starter.Blazor</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/fsh.css" rel="stylesheet" />
    <link href="css/loading.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <style>
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .initial-loading-wrapper {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 9999;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .initial-loading-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url('https://ohdb2ctemplates.blob.core.windows.net/ohdb2c-templates/cornfield.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }

            .initial-loading-container {
                position: relative;
                z-index: 1;
                background-color: #202528;
                border-radius: 5px;
                box-shadow: 0px 8px 10px -5px rgba(0,0,0,0.2), 0px 16px 24px 2px rgba(0,0,0,0.14), 0px 6px 30px 5px rgba(0,0,0,0.12);
                padding: 32px;
                min-width: 320px;
                max-width: 90vw;
                text-align: center;
            }

            .initial-loading-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 24px;
            }

            .initial-loading-header {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .initial-loading-title {
                font-family: 'Roboto', sans-serif;
                font-size: 2rem;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.87);
                margin: 0;
                line-height: 1.2;
            }

            .initial-loading-subtitle {
                font-family: 'Roboto', sans-serif;
                font-size: 1.5rem;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.70);
                margin: 0;
                line-height: 1.2;
            }

            .initial-loading-message {
                font-family: 'Roboto', sans-serif;
                font-size: 1rem;
                color: rgba(255, 255, 255, 0.70);
                line-height: 1.5;
                max-width: 300px;
            }

            .initial-loading-spinner {
                margin-top: 8px;
                width: 40px;
                height: 40px;
            }

            .spinner-circle {
                stroke: rgba(76,175,80,1);
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -35px;
                animation: spin 1.4s ease-in-out infinite;
            }

            @media (max-width: 600px) {
                .initial-loading-container {
                    padding: 24px;
                    min-width: 280px;
                }
                
                .initial-loading-title {
                    font-size: 1.75rem;
                }
                
                .initial-loading-subtitle {
                    font-size: 1.25rem;
                }
                
                .initial-loading-message {
                    font-size: 0.875rem;
                }
            }
        </style>

        <div class="initial-loading-wrapper">
            <div class="initial-loading-background"></div>
            <div class="initial-loading-container">
                <div class="initial-loading-content">
                    <div class="initial-loading-header">
                        <h1 class="initial-loading-title">OHD Harvest</h1>
                        <h2 class="initial-loading-subtitle">Marketplace</h2>
                    </div>
                    <div class="initial-loading-message">
                        Please wait while we load the latest updates
                    </div>
                    <div class="initial-loading-spinner">
                        <svg viewBox="22 22 44 44">
                            <circle class="spinner-circle" cx="44" cy="44" r="20.2" fill="none" stroke-width="3.6"></circle>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
