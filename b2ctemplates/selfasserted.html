<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Registration - OHD Harvest Marketplace</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-color: rgba(76,175,80,1);
            --primary-dark: rgba(56,142,60,1);
            --background-color: #1b1f22;
            --surface-color: #202528;
            --text-primary: rgba(255,255,255, 0.70);
            --text-secondary: rgba(255,255,255, 0.50);
            --border-radius: 5px;
            --elevation-25: 0px 8px 10px -5px rgba(0,0,0,0.2), 0px 16px 24px 2px rgba(0,0,0,0.14), 0px 6px 30px 5px rgba(0,0,0,0.12);
        }
        
        body {
            font-family: 'Roboto', 'Helvetica', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            background-image: url('https://ohdb2ctemplates.blob.core.windows.net/ohdb2c-templates/cornfield.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            padding: 16px;
        }
        
        .paper {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--elevation-25);
            padding: 32px;
        }
        
        h1 {
            font-size: 2.125rem;
            font-weight: 400;
            line-height: 1.235;
            letter-spacing: 0.00735em;
            margin-bottom: 32px;
            text-align: center;
            color: var(--text-primary);
        }
        
        /* Minimal B2C overrides */
        .intro h2 {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 16px;
            text-align: center;
        }
        
        .intro p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 24px;
        }
        
        /* Hide itemLevel errors by default (from official template) */
        .attrEntry .itemLevel {
            display: none;
        }
        
        /* Basic input styling for dark theme */
        #api input[type="text"],
        #api input[type="email"],
        #api input[type="password"],
        #api input[type="tel"],
        #api input[type="number"],
        #api input[type="date"],
        #api select,
        #api textarea {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.23);
            border-radius: var(--border-radius);
            padding: 12px 16px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 4px;
        }
        
        #api input:focus,
        #api select:focus,
        #api textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        #api label {
            color: var(--text-primary);
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }
        
        /* Add spacing between form fields */
        #api .entry-item {
            margin-bottom: 20px;
        }
        
        /* Style required asterisks */
        #api .required {
            color: #ff6b6b;
        }
        
        /* Button styling */
        #api button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px 24px;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02857em;
            text-transform: uppercase;
            cursor: pointer;
            margin-right: 12px;
            margin-top: 10px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        
        #api button:hover {
            background-color: var(--primary-dark);
        }
        
        /* Cancel button styling */
        #api button.cancel,
        #api button[name="cancel"] {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.23);
        }
        
        #api button.cancel:hover,
        #api button[name="cancel"]:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        
        /* Style error text for better visibility on dark background */
        #api .error {
            color: #ff6b6b;
            font-size: 0.875rem;
            margin-top: 4px;
        }
        
        /* Style links */
        #api a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        #api a:hover {
            text-decoration: underline;
        }
        
        /* Checkbox styling */
        #api input[type="checkbox"],
        #api input[type="radio"] {
            width: auto;
            margin-right: 8px;
            accent-color: var(--primary-color);
        }
        
        /* Select dropdown styling */
        #api select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255,255,255,0.7)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
            cursor: pointer;
        }
        
        #api select option {
            background-color: var(--surface-color);
            color: var(--text-primary);
        }
        
        /* Readonly fields */
        #api input[readonly],
        #api textarea[readonly] {
            background-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        /* Working/loading state */
        #api .working {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 16px;
        }
        
        /* Success messages */
        #api .success {
            color: var(--primary-color);
            font-size: 0.875rem;
            margin-top: 16px;
            text-align: center;
        }
        
        /* Help text */
        #api .helpText,
        #api .help-text {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 4px;
        }





        #continue {
            display: block !important;
            margin: 0 auto !important;
            text-align: center !important;
        }


        #api #attributeList ul {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            list-style: none !important;
            text-align: left !important;
        }

        #api #attributeList ul li {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            text-align: left !important;
        }





    </style>
</head>
<body>
    <div class="container">
        <div class="paper">
            <h1>
                OHD Harvest<br />
                Marketplace
            </h1>
            <div id="api"></div>
        </div>
    </div>
</body>
</html>
